name: Diagnose Crash (Emulator)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'
      - '.github/scripts/diagnose.sh'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/notes-release.jks" \
            -alias notes -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass notes123456 -keypass notes123456 \
            -dname "CN=KuiklyNotes, OU=OpenSource, O=KuiklyNotes, L=CN, ST=CN, C=CN"
          echo "NOTES_KEYSTORE=$RUNNER_TEMP/notes-release.jks" >> "$GITHUB_ENV"
          echo "NOTES_STORE_PASS=notes123456" >> "$GITHUB_ENV"
          echo "NOTES_KEY_ALIAS=notes" >> "$GITHUB_ENV"
          echo "NOTES_KEY_PASS=notes123456" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run crash diagnostics on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: sh .github/scripts/diagnose.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crash-diagnostics-api${{ matrix.api-level }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30
