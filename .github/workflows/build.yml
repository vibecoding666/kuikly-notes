name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/notes-release.jks" \
            -alias notes -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass notes123456 -keypass notes123456 \
            -dname "CN=KuiklyNotes, OU=OpenSource, O=KuiklyNotes, L=CN, ST=CN, C=CN"
          echo "NOTES_KEYSTORE=$RUNNER_TEMP/notes-release.jks" >> "$GITHUB_ENV"
          echo "NOTES_STORE_PASS=notes123456" >> "$GITHUB_ENV"
          echo "NOTES_KEY_ALIAS=notes" >> "$GITHUB_ENV"
          echo "NOTES_KEY_PASS=notes123456" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Verify APK size (<= 5 MB)
        run: |
          mkdir -p out
          APK=$(find androidApp/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK produced"
            find androidApp/build/outputs -type f
            exit 1
          fi
          cp "$APK" out/kuikly-notes-release.apk
          SIZE=$(stat -c%s out/kuikly-notes-release.apk)
          echo "Release APK: $APK"
          echo "APK size: $SIZE bytes ($((SIZE / 1024)) KiB)"
          if [ "$SIZE" -gt 5242880 ]; then
            echo "ERROR: APK exceeds the 5 MB limit"
            exit 1
          fi
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kuikly-notes-release-apk
          path: out/kuikly-notes-release.apk
          if-no-files-found: error
          retention-days: 90
